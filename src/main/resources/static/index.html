<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 펀딩 페이지</title>
    <style>
        body { font-family: 'Arial', sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background-color: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .progress-bar-bg { background: #eee; height: 24px; border-radius: 12px; overflow: hidden; margin: 15px 0; }
        .progress-bar-fill { background: #ff6b6b; height: 100%; width: 0%; transition: width 0.5s ease; text-align: center; color: white; font-size: 12px; line-height: 24px; font-weight: bold; }
        .account-box { background: #f1f3f5; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 14px; margin: 10px 0; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; }
        button { background: #ff6b6b; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background: #fa5252; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">🎉 펀딩 불러오는 중...</h2>
    <p><strong>목표 금액:</strong> <span id="targetAmount">0</span>원</p>
    <p><strong>현재 모인 금액:</strong> <span id="currentAmount">0</span>원 (<span id="percent">0</span>%)</p>

    <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill">0%</div>
    </div>

    <div class="account-box">
        🏦 입금 계좌: <span id="accountInfo">-</span>
    </div>
</div>

<div class="card">
    <h3>🎁 축하 메시지 & 펀딩 보내기</h3>
    <input type="text" id="contributorName" placeholder="내 이름 (예: 민석)">
    <input type="number" id="amount" placeholder="보낼 금액 (예: 20000)">
    <textarea id="message" rows="3" placeholder="축하 메시지를 남겨주세요!"></textarea>
    <button onclick="submitFunding()">펀딩 참여하기</button>
</div>

<script>
    const roomId = 1; // 테스트용 1번 펀딩방 ID

    // 펀딩 정보 불러오기
    async function loadFundingData() {
        const response = await fetch(`/api/funding/${roomId}`);
        const data = await response.json();

        document.getElementById('title').innerText = data.title;
        document.getElementById('targetAmount').innerText = data.targetAmount.toLocaleString();
        document.getElementById('currentAmount').innerText = data.currentAmount.toLocaleString();
        document.getElementById('accountInfo').innerText = data.accountInfo;

        const percent = Math.min(Math.round((data.currentAmount / data.targetAmount) * 100), 100);
        document.getElementById('percent').innerText = percent;

        const fill = document.getElementById('progressFill');
        fill.style.width = percent + '%';
        fill.innerText = percent + '%';
    }

    // 친구의 펀딩 참여 신청
    async function submitFunding() {
        const name = document.getElementById('contributorName').value;
        const amount = document.getElementById('amount').value;
        const message = document.getElementById('message').value;

        if(!name || !amount) {
            alert('이름과 금액을 입력해 주세요!');
            return;
        }

        const response = await fetch(`/api/funding/${roomId}/apply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contributorName: name,
                amount: parseInt(amount),
                message: message
            })
        });

        if (response.ok) {
            alert('펀딩 신청 완료! 방장이 입금을 확인하면 게이지가 올라갑니다 🚀');
            document.getElementById('contributorName').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('message').value = '';
        }
    }

    loadFundingData();
</script>
</body>
</html>
